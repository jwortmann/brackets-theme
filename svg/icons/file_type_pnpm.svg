<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
    <defs>
        <filter id="shadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/>
            <feOffset dy="0.5"/>
            <feBlend in="SourceGraphic" in2="blurOut"/>
        </filter>
    </defs>
    <g filter="url(#shadow)">
        <rect fill="#ffffff" width="16" height="16"/>
        <rect fill="#f9ad00" x="1" y="1" width="4" height="4"/>
        <rect fill="#f9ad00" x="6" y="1" width="4" height="4"/>
        <rect fill="#f9ad00" x="11" y="1" width="4" height="4"/>
        <rect fill="#4e4e4e" x="6" y="6" width="4" height="4"/>
        <rect fill="#f9ad00" x="11" y="6" width="4" height="4"/>
        <rect fill="#4e4e4e" x="1" y="11" width="4" height="4"/>
        <rect fill="#4e4e4e" x="6" y="11" width="4" height="4"/>
        <rect fill="#4e4e4e" x="11" y="11" width="4" height="4"/>
    </g>
</svg>
